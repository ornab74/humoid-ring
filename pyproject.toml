[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "humoid-agent-tui"
version = "0.1.0"
description = "Advanced multi-provider terminal agent harness with Weaviate memory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "textual>=1.0.0",
  "rich>=13.9.0",
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.28.0",
  "platformdirs>=4.3.0",
  "huggingface-hub>=0.28.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
weaviate = ["weaviate-client>=4.12.0"]
local = ["llama-cpp-python[server]>=0.3.34"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0"]

[project.scripts]
humoid = "humoid_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/humoid_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
